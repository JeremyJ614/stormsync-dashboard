name: Deploy edge functions

# WHY THIS EXISTS
# `chase-target` is two files — index.ts and terrain.ts — and the Supabase
# dashboard's function editor only ever shows one. Deploying from the dashboard
# therefore either drops terrain.ts or, worse, silently redeploys whatever old
# single-file source the editor still had, which is exactly what happened: the
# migration landed, the function was "deployed", and the code running in
# production was still the previous version. The backfill cron fired every
# twenty minutes and re-ran the current day because the deployed code had never
# heard of `action: backfill`.
#
# This deploys from the repository, so what runs is what is on the branch, and
# multi-file functions are bundled by the CLI rather than by hand.
#
# ONE-TIME SETUP
#   Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_ACCESS_TOKEN   a personal access token from
#                             https://supabase.com/dashboard/account/tokens
#     SUPABASE_PROJECT_REF    the project ref from the dashboard URL
#
# TO RUN
#   Actions → Deploy edge functions → Run workflow → pick the branch and the
#   function. "all" deploys every function in supabase/functions.

on:
  workflow_dispatch:
    inputs:
      function:
        description: "Which function to deploy"
        type: choice
        options: [chase-target, storm-engine, weather, both, all]
        default: both

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: github-repo
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show what is about to be deployed
        run: |
          echo "Branch:   ${{ github.ref_name }}"
          echo "Commit:   ${{ github.sha }}"
          echo "Selection: ${{ inputs.function }}"
          echo
          echo "Files the CLI will bundle:"
          find supabase/functions -name '*.ts' | sort

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set as repository secrets."
            exit 1
          fi

          case "${{ inputs.function }}" in
            both) TARGETS="chase-target storm-engine" ;;
            all)  TARGETS="$(ls supabase/functions)" ;;
            *)    TARGETS="${{ inputs.function }}" ;;
          esac

          for fn in $TARGETS; do
            # Skip shared directories that are imported rather than served.
            case "$fn" in _*) echo "skipping $fn"; continue ;; esac
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done

      - name: Confirm what is now live, and that JWT settings match config.toml
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # A deploy that reports success but leaves the old version live is the
          # failure this workflow exists to prevent, so the versions are read
          # back rather than assumed.
          #
          # `verify_jwt` is read back too, and a mismatch FAILS the job. On
          # 2026-09-17 the `weather` function was redeployed from somewhere
          # without this repo's config.toml — the dashboard's editor does
          # exactly that — and the CLI's default flipped verification ON. The
          # browser sends no Authorization header to that proxy, so every NWS,
          # SPC and Open-Meteo call behind it returned 401 and every map in the
          # app went blank. Nothing reported an error: the deploy "succeeded",
          # the function was ACTIVE, and only the flag had moved. A silent
          # setting that can take the whole app down has to be checked, not
          # trusted.
          curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions" > /tmp/live.json
          python3 - <<'PY'
          import datetime, json, re, sys

          live = json.load(open("/tmp/live.json"))

          # config.toml is the declaration; anything it does not name keeps the
          # CLI default, which is verification ON.
          want, slug = {}, None
          for line in open("supabase/config.toml"):
              m = re.match(r"\s*\[functions\.([^\]]+)\]", line)
              if m:
                  slug = m.group(1)
                  want.setdefault(slug, True)
              elif slug and re.match(r"\s*verify_jwt\s*=", line):
                  want[slug] = line.split("=", 1)[1].strip() == "true"

          bad = []
          for f in sorted(live, key=lambda x: x["slug"]):
              s, got = f["slug"], f.get("verify_jwt")
              exp = want.get(s)
              mark = ""
              if exp is not None and got != exp:
                  mark = f"  <-- MISMATCH, config.toml says {exp}"
                  bad.append((s, exp, got))
              when = datetime.datetime.utcfromtimestamp(
                  f["updated_at"] / 1000).strftime("%Y-%m-%d %H:%M:%SZ")
              print(f"{s:<24} v{str(f.get('version')):<4} "
                    f"{f.get('status',''):<8} verify_jwt={str(got):<5} "
                    f"updated {when}{mark}")

          if bad:
              print()
              for s, exp, got in bad:
                  print(f"::error::{s} is live with verify_jwt={got} but "
                        f"config.toml declares {exp}. Redeploy {s} from this "
                        f"repository — deploying it from the Supabase dashboard "
                        f"resets this flag and 401s every caller.")
              sys.exit(1)
          PY
