name: Render model maps

# Phase 4 — HRRR/GFS map frames for the Model Runs viewer.
#
# CADENCE IS DELIBERATE, AND THE BUDGET HAS MOVED. This repo is private, so
# GitHub Actions gives 2,000 free minutes/month.
#
# When this was written a run was ~7 minutes and four a day was 42% of the
# allowance. The parameter list has since gone from 20 to 84 across three models
# and the frames are twice the size, and a full serial HRRR render measured
# TWENTY-ONE minutes on 13 September — about 6,000 min/month for the whole
# schedule, three times the allowance. That does not fail loudly; it stops
# rendering somewhere around the tenth of the month.
#
# So `render_maps.py` now renders forecast hours in a process pool, one per
# core, which is where the arithmetic comes back inside the allowance. If it
# ever creeps out again the cheapest lever is this cron: dropping HREF to twice
# a day costs almost nothing (ensemble probabilities move slowly, which is why
# its frames are already two-hourly) and saves the most minutes per parameter.
#
# The renderer never downloads whole GRIB files — it reads each file's .idx and
# issues HTTP Range requests for just the records it needs (measured: 0.21 MB of
# a 140 MB file for composite reflectivity).

on:
  schedule:
    # HRRR at 01/07/13/19Z — ~40 min after the 00/06/12/18Z runs land on AWS.
    - cron: "40 1,7,13,19 * * *"
    # GFS is slower to publish; give it ~3.5 h after cycle time.
    - cron: "30 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model to render"
        type: choice
        options: [hrrr, gfs, href, both]
        default: both
      max_fhr:
        description: "Last forecast hour"
        default: "18"

concurrency:
  group: render-model-maps
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # Our requirements live under scripts/, not at the repo root; without
          # this setup-python fails instantly with "no file matched".
          cache-dependency-path: scripts/requirements-render.txt

      - name: System libs for cartopy / eccodes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgeos-dev libproj-dev proj-bin libeccodes0

      - name: Install Python deps
        run: pip install -q -r scripts/requirements-render.txt

      # Which model this invocation renders. Scheduled runs are keyed off the
      # cron expression that triggered them; manual runs use the input.
      - name: Decide model
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "40 1,7,13,19 * * *" ]; then
              echo "model=hrrr" >> $GITHUB_OUTPUT
            else
              # The later slot renders GFS and HREF: both are 6-hourly and both
              # are published by the time this fires.
              echo "model=gfs+href" >> $GITHUB_OUTPUT
            fi
          else
            echo "model=${{ inputs.model || 'both' }}" >> $GITHUB_OUTPUT
          fi

      - name: Render HRRR
        if: steps.pick.outputs.model == 'hrrr' || steps.pick.outputs.model == 'both'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/render_maps.py --model hrrr --max-fhr ${{ inputs.max_fhr || 18 }} --step 1

      - name: Render GFS
        if: contains(steps.pick.outputs.model, 'gfs') || steps.pick.outputs.model == 'both'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/render_maps.py --model gfs --max-fhr 48 --step 3

      # HREF probabilities, 2-hourly to F36.
      #
      # Twenty-one products times nineteen frames times four cycles a day is
      # already the largest single contributor to the storage budget, and
      # ensemble probability fields change slowly enough between adjacent hours
      # that a 2-hour loop loses nothing a chaser would act on.
      - name: Render HREF
        if: contains(steps.pick.outputs.model, 'href') || steps.pick.outputs.model == 'both'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/render_maps.py --model href --max-fhr 36 --step 2
